# Local stack for trying the production image: PostgreSQL + the API.
#   docker compose up --build
# Values come from .env (DATABASE_URL is built here for the db container).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: smart_classroom
      POSTGRES_USER: smart_class
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_class -d smart_classroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://smart_class:${POSTGRES_PASSWORD}@db:5432/smart_classroom
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      ADMIN_REGISTRATION_CODE: ${ADMIN_REGISTRATION_CODE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
